name: Build Pixel Pin for Windows

on:
  push:
    branches: ["**"]
    paths: ['*.cs', '*.xaml', 'PixelPin.csproj', 'app.manifest', 'assets/app.ico', 'assets/app-icon.png', 'tests/PixelPin.Checks/**', '.github/workflows/windows-build.yml']
  pull_request:
    branches: [main]
    paths: ['*.cs', '*.xaml', 'PixelPin.csproj', 'app.manifest', 'assets/app.ico', 'assets/app-icon.png', 'tests/PixelPin.Checks/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build app and checks
        run: dotnet build tests/PixelPin.Checks/Check.csproj --configuration Release
      - name: Check preferences, mini layouts and local data safety without showing windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/mini-mode -Force | Out-Null
          dotnet run --project tests/PixelPin.Checks/Check.csproj --configuration Release --no-build -- artifacts/mini-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable Windows app
        run: dotnet publish PixelPin.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-Pin-Windows-preview
          path: |
            artifacts/windows/
            artifacts/mini-mode/
          if-no-files-found: error
          retention-days: 14
