name: Build Pixel Pin for macOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify sRGB sampling and loupe consistency
        run: swift test --package-path macos
      - name: Build universal macOS app
        env:
          MACOS_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.2.1' }}
          MACOS_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_ED_PUBLIC_KEY: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && vars.SPARKLE_ED_PUBLIC_KEY != '' && secrets.SPARKLE_ED_PRIVATE_KEY != '' && vars.SPARKLE_ED_PUBLIC_KEY || '' }}
        run: bash macos/build-app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 'macos/build/Pixel Pin.app'
      - name: Package app
        id: package
        run: |
          archive="Pixel-Pin-${GITHUB_REF_NAME//\//-}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent 'macos/build/Pixel Pin.app' "$archive"
          echo "name=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pixel Pin for macOS ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            Universal app for Apple silicon and Intel Macs.

            - Uses ScreenCaptureKit and the macOS screen picker on macOS 14+ instead of legacy direct capture.
            - HEX, RGB, swatches, and the magnifier now share one explicitly sRGB capture buffer.
            - Corrects the magnifier marker near display edges.

            On macOS 14+, choose the display to sample in the system picker when opening the app. Use **Choose a screen** to switch displays or restart a stopped capture. macOS 13 uses ScreenCaptureKit with Screen Recording permission.

            **Preview build:** This app uses an ad-hoc signature and is not Developer ID signed or notarized. macOS may block it on first launch. Screen Recording permission is required to sample pixels. Permission may need to be granted again after an app update.
          files: Pixel-Pin-${{ github.ref_name }}-macos-universal.zip
      - name: Generate signed Sparkle appcast
        id: appcast
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha')
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PUBLIC_KEY" || -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "Sparkle signing keys are not configured; skipping appcast generation."
            exit 0
          fi
          tool="$(find macos/.build-arm64/artifacts -type f -name generate_appcast -print -quit)"
          test -n "$tool"
          mkdir -p macos/update-feed
          cp "${{ steps.package.outputs.name }}" macos/update-feed/
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            macos/update-feed
          grep -q 'sparkle:edSignature=' macos/update-feed/appcast.xml
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Attach Sparkle appcast to release
        if: steps.appcast.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: macos/update-feed/appcast.xml

