name: Build Pixel Pin for macOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'macos/Sources/**'
      - 'macos/Tests/**'
      - 'macos/InfoPlist/**'
      - 'macos/Package.*'
      - 'macos/*.sh'
      - 'macos/ci/**'
      - 'macos/installer/**'
      - 'assets/app-icon.png'
      - '.github/workflows/macos-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macos/Sources/**'
      - 'macos/Tests/**'
      - 'macos/InfoPlist/**'
      - 'macos/Package.*'
      - 'macos/*.sh'
      - 'macos/ci/**'
      - 'macos/installer/**'
      - 'assets/app-icon.png'
      - '.github/workflows/macos-release.yml'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      compiled_run: ${{ steps.previous.outputs.run_id }}
      compiled_artifact: ${{ steps.previous.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate shell scripts
        run: |
          bash -n macos/build-app.sh
          bash -n macos/make-appcast.sh
          bash -n macos/make-dmg.sh
      - name: Test compiled-input reuse safety
        run: |
          python3 -m py_compile macos/installer/layout.py
          python3 -m unittest discover -s macos/ci -v
      - name: Validate workflow with pinned actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --pattern actionlint_1.7.12_checksums.txt --dir "$tool_dir"
          (cd "$tool_dir" && sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt)
          tar -xzf "$tool_dir/actionlint_1.7.12_linux_amd64.tar.gz" -C "$tool_dir"
          "$tool_dir/actionlint" .github/workflows/macos-release.yml
      # Wait on Linux so an earlier build keeps the macOS runner it needs.
      - name: Find an already tested build of this commit
        id: previous
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 macos/ci/compiled_inputs.py find --wait-seconds 480
  build:
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify toolchain and script syntax
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          swiftc -parse macos/installer/background.swift
          for script in macos/build-app.sh macos/make-appcast.sh macos/make-dmg.sh; do bash -n "$script"; done
          swift package --package-path macos dump-package > /dev/null
      - name: Restore Swift package download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: macos15-xcode16.4-swiftpm-${{ hashFiles('macos/Package.swift') }}
      - name: Restore verified compilation inputs
        id: reuse
        if: needs.validate.outputs.compiled_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ needs.validate.outputs.compiled_run }}
          INPUT_ARTIFACT: ${{ needs.validate.outputs.compiled_artifact }}
        run: |
          input_dir="$RUNNER_TEMP/compiled-inputs"
          mkdir -p "$input_dir"
          if gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" --name "$INPUT_ARTIFACT" --dir "$input_dir" && \
             python3 macos/ci/compiled_inputs.py restore "$input_dir/compiled-inputs.tar.gz"; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Compiled inputs could not be validated; running a full build.'
          fi
      - name: Configure version and update channel
        id: config
        env:
          PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          PRIVATE_KEY_READY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          version=1.2.1
          feed_tag=macos-updates
          public_key=''
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == *-* ]]; then feed_tag=macos-beta-updates; fi
            version="${version%%-*}"
            if [[ -z "$PUBLIC_KEY" || "$PRIVATE_KEY_READY" != true ]]; then
              echo '::error::Both Sparkle repository keys are required for a release.'
              exit 1
            fi
            if [[ ! "$PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
              echo '::error::The Sparkle public key must be the base64 key string only.'
              exit 1
            fi
            public_key="$PUBLIC_KEY"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
          {
            echo "MACOS_APP_VERSION=$version"
            echo "MACOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            echo "MACOS_UPDATE_FEED_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$feed_tag/appcast.xml"
            echo "SPARKLE_ED_PUBLIC_KEY=$public_key"
          } >> "$GITHUB_ENV"
          {
            echo "feed_tag=$feed_tag"
            echo "archive=Pixel-Pin-${GITHUB_REF_NAME//\//-}-macos-universal.zip"
            echo "dmg=Pixel-Pin-${GITHUB_REF_NAME//\//-}-macos-universal.dmg"
          } >> "$GITHUB_OUTPUT"
      - name: Test sRGB sampling and loupe consistency
        if: steps.reuse.outputs.hit != 'true'
        run: swift test --package-path macos
      - name: Build Apple silicon executable
        if: steps.reuse.outputs.hit != 'true'
        run: bash macos/build-app.sh "$PWD/macos/build" arm64
      - name: Build Intel executable
        if: steps.reuse.outputs.hit != 'true'
        run: bash macos/build-app.sh "$PWD/macos/build" x86_64
      - name: Assemble and validate universal app bundle
        run: |
          bash macos/build-app.sh "$PWD/macos/build" package
          codesign --verify --deep --strict --verbose=2 'macos/build/Pixel Pin.app'
          otool -L 'macos/build/Pixel Pin.app/Contents/MacOS/PixelPin'
      - name: Package verified app
        env:
          ARCHIVE: ${{ steps.config.outputs.archive }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'macos/build/Pixel Pin.app' "$ARCHIVE"
          unzip -tqq "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Create and validate drag-to-Applications installer
        env:
          DMG: ${{ steps.config.outputs.dmg }}
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r macos/installer/requirements.txt
          bash macos/make-dmg.sh "$PWD/$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
      - name: Snapshot tested compilation inputs
        if: github.event_name == 'push' && steps.reuse.outputs.hit != 'true'
        run: python3 macos/ci/compiled_inputs.py pack "$RUNNER_TEMP/compiled-inputs.tar.gz"
      - name: Save reusable compilation inputs
        if: github.event_name == 'push' && steps.reuse.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-compiled-v1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compiled-inputs.tar.gz
            ${{ runner.temp }}/compiled-inputs.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Sign and validate Sparkle update feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ARCHIVE: ${{ steps.config.outputs.archive }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | bash macos/make-appcast.sh "$ARCHIVE" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.archive }}
          path: |
            ${{ steps.config.outputs.archive }}
            ${{ steps.config.outputs.archive }}.sha256
            ${{ steps.config.outputs.dmg }}
            ${{ steps.config.outputs.dmg }}.sha256
            macos/update-feed/appcast.xml
            macos/build/installer-preview.png
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Publish verified release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pixel Pin for macOS ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          body: |
            Universal app for Apple silicon and Intel Macs.

            - Includes a DMG installer: drag Pixel Pin to Applications, then open the installed app.
            - A branded installer window includes a drag direction and installation guidance in Korean, English and Simplified Chinese.
            - Automatically samples the full display under your pointer after Screen Recording authorization. The system picker remains available in settings.
            - Fixes permission recovery: retries after returning from System Settings, attempts ScreenCaptureKit even when preflight is stale, and shows capture diagnostics.
            - HEX, RGB, swatches, and the magnifier share one sRGB pixel buffer.
            - Opens settings with Command-comma in a centered popup. Click outside or press Escape to close it.
            - The close button minimizes to the Dock by default; Settings can change it to quit. Command-Q always quits.
            - Includes signed Sparkle updates with separate beta and stable feeds.

            macOS may still ask to renew direct screen access; the app cannot permanently suppress system permission prompts. Automatic sampling can be disabled in settings to use the system picker instead. For comparison, set Digital Color Meter to sRGB and its smallest aperture.

            Sparkle authenticates updates. This app still uses an ad-hoc Apple code signature and is not Developer ID signed or notarized, so the first-open macOS security warning may remain.
          files: |
            ${{ steps.config.outputs.archive }}
            ${{ steps.config.outputs.archive }}.sha256
            ${{ steps.config.outputs.dmg }}
            ${{ steps.config.outputs.dmg }}.sha256
            macos/update-feed/appcast.xml
      - name: Publish channel update feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TAG: ${{ steps.config.outputs.feed_tag }}
        run: |
          if ! gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Pixel Pin $FEED_TAG feed" --notes 'Automatically maintained macOS update feed. Download the app from a versioned release.'
          fi
          gh release upload "$FEED_TAG" macos/update-feed/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
          # Promote existing beta installations onto the stable channel as well.
          if [[ "$FEED_TAG" == macos-updates ]] && gh release view macos-beta-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload macos-beta-updates macos/update-feed/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
          fi
  refresh-site:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Rebuild website after publishing the stable Mac assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
